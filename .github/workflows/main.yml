name: Build Thalab APK to Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'رقم الإصدار (مثال: v1.9.1)'
        required: true
        default: 'v1.9.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ملاحظة: flutter create يولّد ملفات Gradle فقط إن كانت مفقودة،
      # ولا يكتب فوق ملفاتنا (AndroidManifest.xml و MainActivity.kt) في الريبو.
      - name: Generate Android scaffolding
        run: flutter create --platforms=android --org com.au7md --project-name thalab_app .

      - name: Enable core library desugaring (required by notifications)
        run: |
          sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
          cat << 'GRADLE' >> android/app/build.gradle.kts

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          GRADLE

      # يوقف تقليص الكود والموارد في نسخة release: كان يحذف ملفات صوت الأذان
      # من res/raw ويكسر جدولة الإشعارات (Gson) بصمت.
      - name: Disable R8 / resource shrinking for release
        run: |
          sed -i '/release {/a\            isMinifyEnabled = false\n            isShrinkResources = false' android/app/build.gradle.kts
          grep -n -B1 -A5 "release {" android/app/build.gradle.kts

      # يوحّد Java و Kotlin على 17 لكل المكتبات (flutter_timezone وغيرها)
      # لتفادي خطأ "Inconsistent JVM Target Compatibility".
      - name: Align JVM target and compileSdk for all plugins
        run: |
          cat << 'GRADLE' >> android/build.gradle.kts

          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  }
              }
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension> {
                      compileSdk = 35
                      compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  }
              }
          }
          GRADLE

      - name: Generate launcher icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert assets/images/app_logo.png -gravity center -crop 78%x78%+0+0 +repage -resize 192x192! -alpha remove -alpha off PNG24:/tmp/ic_launcher.png
          for dir in android/app/src/main/res/mipmap-*; do cp /tmp/ic_launcher.png "$dir/ic_launcher.png"; done

      - name: Flutter dependencies
        run: flutter pub get

      - name: Copy Adhan audio to Android raw
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/audio/adhan/*.mp3 android/app/src/main/res/raw/

      - name: Build Release APK (arm64)
        run: flutter build apk --release --split-per-abi

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Thalab-${{ github.event.inputs.version_tag }}.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: "إصدار الثعلب ${{ github.event.inputs.version_tag }}"
          body: "بناء تلقائي لتطبيق الثعلب (معمارية arm64-v8a)."
          files: build/app/outputs/flutter-apk/Thalab-${{ github.event.inputs.version_tag }}.apk
