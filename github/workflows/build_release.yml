name: Build Thalab APK to Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'رقم الإصدار (مثال: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Android Platform Files
        run: |
          flutter create --platforms=android --org com.au7md --project-name thalab_app .
          flutter pub get

      - name: Build Release APK (arm64)
        run: flutter build apk --release --split-per-abi

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Thalab-${{ github.event.inputs.version_tag }}.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: "إصدار الثعلب ${{ github.event.inputs.version_tag }}"
          body: "بناء تلقائي لتطبيق الثعلب (معمارية arm64-v8a)."
          files: build/app/outputs/flutter-apk/Thalab-${{ github.event.inputs.version_tag }}.apk
