name: al_thaalab
description: تطبيق الثعلب - تجربة متكاملة للوسائط والموسيقى.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # إدارة الحالة والتنقل
  provider: ^6.1.1
  # أيقونات عصرية وتصميم هادئ
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  # تشغيل الصوتيات والفيديو
  just_audio: ^0.9.36
  video_player: ^2.8.2
  # الإشعارات المحلية
  flutter_local_notifications: ^16.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
