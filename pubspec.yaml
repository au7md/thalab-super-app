name: thalab_app
description: تطبيق الثعلب - منظومة متكاملة تشمل الواحة الإيمانية (رفيق) وميزات الترفيه والتنظيم.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الواجهة والأيقونات والخطوط
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # حسابات المواقيت والتقويم الهجري والموقع
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  geolocator: ^13.0.1
  intl: any

  # الإشعارات والجدولة والمنطقة الزمنية
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # التخزين المحلي والحالة
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
